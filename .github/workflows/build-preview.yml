name: build-preview
on: [push, workflow_dispatch]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: alislam-it-website}
      - uses: actions/checkout@v4
        with: {repository: ataulwasihtariq/waqfe-nau, path: waqfe-nau}
      - uses: actions/checkout@v4
        with: {repository: ataulwasihtariq/rishta-nata, path: rishta-nata}
      - run: pip install jinja2
      - run: python3 alislam-it-website/src/build.py --sources .
      - uses: actions/upload-artifact@v4
        with: {name: site, path: alislam-it-website/site}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: {path: alislam-it-website/site}
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
